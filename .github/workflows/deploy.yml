name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.3.0

      # The no-sound test runs real ffprobe and ffmpeg.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: GIT_SHA=${{ github.sha }}
          platforms: linux/amd64
          tags: telegram-transcribe-bot:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ffmpeg must carry libmp3lame, or every transcription fails in prod only
        run: |
          docker run --rm telegram-transcribe-bot:check ffmpeg -hide_banner -encoders | grep -q libmp3lame \
            || { echo "::error::no libmp3lame: the bot cannot build the mp3 it sends to the transcription model"; exit 1; }

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          platforms: linux/amd64
          tags: |
            ghcr.io/esi-abolfazl/telegram-transcribe-bot:latest
            ghcr.io/esi-abolfazl/telegram-transcribe-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
